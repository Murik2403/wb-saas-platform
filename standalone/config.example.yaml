# Храните рабочую копию вне checkout: по умолчанию
# ~/.wb-saas-secrets/standalone-config.yaml. Для секрет-менеджера можно
# задать WB_SAAS_STANDALONE_CONFIG_PATH.

wb:
  token: ""          # Кабинет продавца WB → Настройки → Доступ к API. Нужны scope: "Цены и скидки", "Продвижение", "Аналитика".

ozon:
  client_id: ""       # Кабинет продавца Ozon → Настройки → Seller API
  api_key: ""

price_agent:
  min_margin_pct: 15
  max_step_pct: 5
  undercut_competitor_pct: 1

ad_agent:
  max_drr_pct: 25
  min_drr_pct: 5
  max_budget_step_pct: 20
