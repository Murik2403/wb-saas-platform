<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Marketshelper{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 0%, #17152b 0%, #0b0e14 36%, #090b10 100%);
    color: #e7e9ee; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 400px; margin: 40px 16px;
    background: linear-gradient(145deg, rgba(28,34,48,.96), rgba(17,22,32,.96));
    border: 1px solid rgba(255,255,255,.075); border-radius: 18px; padding: 32px;
    box-shadow: 0 12px 32px rgba(0,0,0,.25);
  }
  .card.card-wide { max-width: 720px; }
  .card-wide h2 { font-size: 1.1rem; margin: 26px 0 8px; }
  .card-wide h2:first-of-type { margin-top: 0; }
  .card-wide p, .card-wide li { color: #c4cad4; font-size: .93rem; line-height: 1.55; }
  .card-wide ul, .card-wide ol { padding-left: 20px; margin: 8px 0; }
  .card-wide table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: .9rem; }
  .card-wide table td { padding: 6px 10px 6px 0; color: #c4cad4; vertical-align: top; }
  .card-wide table td:first-child { color: #98a2b3; white-space: nowrap; }
  .card-wide .back-link { display: inline-block; margin-top: 4px; color: #6d8dfa; text-decoration: none; font-size: .87rem; }
  .card-wide .back-link:hover { text-decoration: underline; }
  .nav-links { display: flex; gap: 16px; justify-content: center; margin-top: 18px; font-size: .82rem; }
  .nav-links a { color: #98a2b3; text-decoration: none; }
  .nav-links a:hover { color: #6d8dfa; }
  h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; margin: 0 0 6px; }
  .subtitle { color: #98a2b3; font-size: .9rem; margin: 0 0 22px; }
  label { display: block; font-size: .82rem; color: #98a2b3; margin: 14px 0 5px; }
  input[type=email], input[type=password], input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12);
    background: #0d1119; color: #e7e9ee; font-size: .95rem;
  }
  input:focus { outline: none; border-color: #6d8dfa; }
  button {
    width: 100%; margin-top: 22px; padding: 11px; border: none; border-radius: 12px;
    background: #6d8dfa; color: #0b0e14; font-weight: 700; font-size: .95rem; cursor: pointer;
  }
  button:hover { background: #86a0ff; }
  .error { background: rgba(224,86,86,.1); border: 1px solid rgba(224,86,86,.3); color: #f0a3a3;
    border-radius: 10px; padding: 10px 12px; font-size: .87rem; margin-bottom: 8px; }
  .info { background: rgba(87,211,145,.1); border: 1px solid rgba(87,211,145,.25); color: #79e2aa;
    border-radius: 10px; padding: 10px 12px; font-size: .87rem; margin-bottom: 8px; }
  .footer-link { text-align: center; margin-top: 18px; font-size: .87rem; color: #98a2b3; }
  .footer-link a { color: #6d8dfa; text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12);
    border-top-color: #6d8dfa; margin: 8px auto 18px; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="card{% block card_extra_class %}{% endblock %}">
{% block content %}{% endblock %}
</div>
</body>
</html>
