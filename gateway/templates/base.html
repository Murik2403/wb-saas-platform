<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MARKETSHELPER{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Design system agreed in the redesign pitch (see the "MARKETSHELPER:
       новый стиль" artifact) -- a dark instrument-panel palette in the
       wildbox/WB-analytics-tool niche, but with a single accent reserved
       for interactive elements and a separate semantic set (good/warn/
       critical) so "brand" and "needs attention" never look the same. */
    --bg:#0a0b12; --surface:#12141e; --surface-2:#1a1d2c;
    --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.17);
    --text:#eef0f7; --text-muted:#8d94aa; --text-faint:#5b6178;
    --accent:#7c6cf6; --accent-strong:#9a8bff; --accent-soft:rgba(124,108,246,.14);
    --good:#3ecf8e; --good-soft:rgba(62,207,142,.12);
    --warn:#f2b84b; --warn-soft:rgba(242,184,75,.12);
    --critical:#f2677a; --critical-soft:rgba(242,103,122,.12);
    --font-display:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:"IBM Plex Mono","SF Mono",monospace;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  body {
    margin: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: var(--font-display); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  /* Default layout: a single centered card (login/register/billing/etc).
     home.html overrides the whole "layout" block for a full-width
     landing page instead -- see the "landing" rules further down. */
  body.card-layout {
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 400px; margin: 40px 16px;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    border: 1px solid var(--border); border-radius: 18px; padding: 32px;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  .card.card-wide { max-width: 720px; }
  .card-wide h2 { font-size: 1.1rem; margin: 26px 0 8px; font-weight: 700; }
  .card-wide h2:first-of-type { margin-top: 0; }
  .card-wide p, .card-wide li { color: var(--text-muted); font-size: .93rem; line-height: 1.6; }
  .card-wide ul, .card-wide ol { padding-left: 20px; margin: 8px 0; }
  .card-wide table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: .9rem; }
  .card-wide table td { padding: 6px 10px 6px 0; color: var(--text-muted); vertical-align: top; }
  .card-wide table td:first-child { color: var(--text-faint); white-space: nowrap; }
  .card-wide .back-link { display: inline-block; margin-top: 4px; color: var(--accent-strong); text-decoration: none; font-size: .87rem; }
  .card-wide .back-link:hover { text-decoration: underline; }
  .nav-links { display: flex; gap: 16px; justify-content: center; margin-top: 18px; font-size: .82rem; }
  .nav-links a { color: var(--text-muted); text-decoration: none; }
  .nav-links a:hover { color: var(--accent-strong); }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em; margin: 0 0 6px; }
  .subtitle { color: var(--text-muted); font-size: .9rem; margin: 0 0 22px; }
  label { display: block; font-size: .82rem; color: var(--text-muted); margin: 14px 0 5px; }
  input[type=email], input[type=password], input[type=text] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--bg); color: var(--text); font-size: .95rem; font-family: var(--font-display);
  }
  input:focus { outline: none; border-color: var(--accent); }
  .checkbox-line { display: flex; align-items: flex-start; gap: 9px; margin: 16px 0 0;
    font-size: .82rem; color: var(--text-muted); line-height: 1.5; cursor: pointer; }
  .checkbox-line input[type=checkbox] { width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0;
    accent-color: var(--accent); cursor: pointer; }
  .checkbox-line a { color: var(--accent-strong); }
  button {
    width: 100%; margin-top: 22px; padding: 11px; border: none; border-radius: 12px;
    background: var(--accent); color: #0a0b12; font-weight: 600; font-size: .95rem; cursor: pointer;
    font-family: var(--font-display);
  }
  button:hover { background: var(--accent-strong); }
  a { color: var(--accent-strong); }
  .error { background: var(--critical-soft); border: 1px solid rgba(242,103,122,.3); color: var(--critical);
    border-radius: 10px; padding: 10px 12px; font-size: .87rem; margin-bottom: 8px; }
  .info { background: var(--good-soft); border: 1px solid rgba(62,207,142,.25); color: var(--good);
    border-radius: 10px; padding: 10px 12px; font-size: .87rem; margin-bottom: 8px; }
  .footer-link { text-align: center; margin-top: 18px; font-size: .87rem; color: var(--text-muted); }
  .footer-link a { color: var(--accent-strong); text-decoration: none; }
  .footer-link a:hover { text-decoration: underline; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--border-strong);
    border-top-color: var(--accent); margin: 8px auto 18px; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- landing layout (home.html only) ---------- */
  body.landing { display: block; }
  .landing-wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 26px 0; flex-wrap: wrap; gap: 10px 16px; }
  .nav-bar .brand { font-weight: 700; font-size: 1.1rem; letter-spacing: -.01em; text-decoration: none; color: var(--text); }
  .nav-bar .links { display: flex; gap: 22px; align-items: center; font-size: .89rem; flex-wrap: wrap; row-gap: 8px; }
  .nav-bar .links a { color: var(--text-muted); text-decoration: none; }
  .nav-bar .links a:hover { color: var(--text); }
  .nav-bar .links a.cta { color: #0a0b12; background: var(--accent); padding: 8px 16px; border-radius: 9px; font-weight: 600; }
  .nav-bar .links a.cta:hover { background: var(--accent-strong); }

  .hero {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; align-items: center;
    padding: 40px 0 76px;
  }
  .hero-content { position: relative; z-index: 1; }
  #heroDash { position: relative; z-index: 1; }

  /* ---------- hero: soft animated background (blobs, bars, trend line) ----------
     Ambient texture, not a focal element -- kept low-opacity/blurred so body
     text stays fully readable on top. Respects prefers-reduced-motion below. */
  .hero-decor { position: absolute; inset: -10% -6%; z-index: 0; overflow: hidden; pointer-events: none; }
  .hero-blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .35;
    animation: heroFloat 17s ease-in-out infinite alternate; }
  .hero-blob-a { width: 360px; height: 360px; left: -80px; top: -60px;
    background: radial-gradient(circle, var(--accent) 0%, transparent 70%); }
  .hero-blob-b { width: 300px; height: 300px; right: -60px; top: 40px; animation-duration: 21s; animation-delay: -6s;
    background: radial-gradient(circle, var(--good) 0%, transparent 70%); }
  @keyframes heroFloat {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(24px, 30px) scale(1.08); }
  }
  .hero-bars { position: absolute; left: 4%; right: 46%; bottom: 6%; height: 42%;
    display: flex; align-items: flex-end; gap: 3.5%; filter: blur(1.5px); opacity: .3; }
  .hero-bars span { flex: 1; height: var(--h); border-radius: 6px 6px 0 0;
    background: linear-gradient(180deg, var(--accent-strong), transparent);
    animation: heroBarPulse 4.5s ease-in-out infinite; animation-delay: var(--d); transform-origin: bottom; }
  @keyframes heroBarPulse {
    0%, 100% { transform: scaleY(1); opacity: .8; }
    50% { transform: scaleY(1.12); opacity: 1; }
  }
  .hero-trend { position: absolute; left: 2%; right: 4%; top: 10%; width: 94%; height: 40%; opacity: .4; filter: blur(.4px); }
  .hero-trend path { fill: none; stroke: var(--good); stroke-width: 2.5; stroke-linecap: round;
    stroke-dasharray: 620; stroke-dashoffset: 620; animation: heroTrendDraw 2.6s ease-out .3s forwards,
    heroTrendGlow 3.6s ease-in-out 3s infinite; }
  @keyframes heroTrendDraw { to { stroke-dashoffset: 0; } }
  @keyframes heroTrendGlow { 0%, 100% { opacity: .4; } 50% { opacity: .75; } }
  @media (prefers-reduced-motion: reduce) {
    .hero-blob, .hero-bars span, .hero-trend path { animation: none; }
    .hero-trend path { stroke-dashoffset: 0; opacity: .4; }
  }
  @media (max-width: 760px) {
    .hero-decor { display: none; }
  }

  /* ---------- shared: any section with its own themed ambient decor ---------- */
  .section-layers, .section-calc, .section-compare { position: relative; overflow: hidden; }
  .section-layers > .section-decor, .section-calc > .section-decor, .section-compare > .section-decor {
    position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  }
  .section-layers > *:not(.section-decor), .section-calc > *:not(.section-decor),
  .section-compare > *:not(.section-decor) { position: relative; z-index: 1; }

  /* ---------- "Для кого": drifting translucent bands (FIFO layers) ---------- */
  .layer-band { position: absolute; left: -8%; width: var(--w); top: var(--y); height: 34px;
    border-radius: 8px; filter: blur(10px); opacity: .16;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: layerDrift 12s ease-in-out infinite alternate; animation-delay: var(--d); }
  @keyframes layerDrift { from { transform: translateX(0); } to { transform: translateX(18%); } }

  /* ---------- calculator: pulsing gauge arc + drifting currency symbols ---------- */
  .calc-gauge { position: absolute; right: 4%; top: 8%; width: 260px; height: 260px; border-radius: 50%;
    border: 22px solid transparent; border-top-color: var(--good); border-right-color: var(--good);
    opacity: .14; filter: blur(2px); transform: rotate(-45deg);
    animation: gaugeSpin 26s linear infinite; }
  @keyframes gaugeSpin { to { transform: rotate(315deg); } }
  .calc-sym { position: absolute; font-family: var(--font-mono); font-weight: 700; color: var(--accent-strong);
    opacity: .16; filter: blur(1px); animation: symFloat 9s ease-in-out infinite; }
  .calc-sym-a { left: 6%; top: 20%; font-size: 3.2rem; animation-delay: 0s; }
  .calc-sym-b { left: 16%; top: 62%; font-size: 2.2rem; color: var(--good); animation-delay: 1.6s; }
  .calc-sym-c { right: 30%; top: 74%; font-size: 2.6rem; animation-delay: 3.1s; }
  @keyframes symFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }

  /* ---------- compare: faint grid + drifting checkmarks ---------- */
  .cmp-grid { position: absolute; inset: 0; opacity: .05;
    background-image: linear-gradient(var(--text) 1px, transparent 1px),
      linear-gradient(90deg, var(--text) 1px, transparent 1px);
    background-size: 46px 46px; }
  .cmp-check { position: absolute; font-weight: 700; color: var(--good); opacity: .14; filter: blur(1px);
    animation: symFloat 8s ease-in-out infinite; }
  .cmp-check-a { left: 8%; top: 16%; font-size: 2.6rem; animation-delay: .4s; }
  .cmp-check-b { right: 12%; top: 30%; font-size: 3.4rem; animation-delay: 2.2s; }
  .cmp-check-c { left: 40%; top: 74%; font-size: 2.2rem; animation-delay: 4s; }

  @media (prefers-reduced-motion: reduce) {
    .layer-band, .calc-gauge, .calc-sym, .cmp-check { animation: none; }
  }
  @media (max-width: 760px) {
    .section-decor { display: none; }
  }
  .hero h1 { font-size: 2.6rem; line-height: 1.12; font-weight: 700; letter-spacing: -.02em; margin: 0 0 18px; text-wrap: balance; }
  .hero p.lead { color: var(--text-muted); font-size: 1.05rem; margin: 0 0 28px; max-width: 46ch; }
  .btn-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 22px;
    border-radius: 11px; font-weight: 600; font-size: .93rem; text-decoration: none; border: 1px solid transparent; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #0a0b12; }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-ghost { color: var(--text); border-color: var(--border-strong); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent-strong); }
  .trial-note { font-size: .82rem; color: var(--text-faint); margin-top: 14px; }

  .mini-dash { border: 1px solid var(--border-strong); border-radius: 14px; background: var(--surface-2);
    padding: 18px; box-shadow: 0 18px 46px rgba(0,0,0,.4); }
  .mini-dash-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .mini-dash-head span { font-size: .74rem; color: var(--text-faint); font-family: var(--font-mono); }
  .mini-dash-head .live { color: var(--good); }
  .mini-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mini-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 12px; }
  .mini-kpi .l { font-size: .68rem; color: var(--text-faint); margin-bottom: 5px; }
  .mini-kpi .v { font-family: var(--font-mono); font-weight: 600; font-size: 1.02rem; font-variant-numeric: tabular-nums; }
  .mini-kpi .v.good { color: var(--good); }

  /* Full-bleed chromatic feature tiles -- color alone tells the categories
     apart, no shared card chrome. Adapted from a dark fintech design system
     reference (Origin Financial / Wealthfront-style "feature category card"
     pattern) rather than our previous uniform hairline-grid cards. */
  .feature-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 28px; }
  .feature { border-radius: 24px; padding: 30px 28px; color: #fff; }
  .feature .ic { width: 34px; height: 34px; border-radius: 999px; background: rgba(255,255,255,.18); color: #fff;
    display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 600; font-size: .76rem; margin-bottom: 16px; }
  .feature h3 { font-size: 1rem; margin: 0 0 8px; font-weight: 600; color: #fff; }
  .feature p { font-size: .87rem; color: rgba(255,255,255,.82); margin: 0; line-height: 1.55; }
  .feature.tile-1 { background: #6a5ce0; }
  .feature.tile-2 { background: #0093b8; }
  .feature.tile-3 { background: #2fae76; }
  .feature.tile-4 { background: #5d7dc4; }
  .feature.tile-5 { background: #b25aac; }
  .feature.tile-6 { background: #c98f2e; }

  .price-strip { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
    padding: 26px 30px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 60px; }
  .price-strip .p-left { font-size: .92rem; color: var(--text-muted); }
  .price-strip .p-left b { color: var(--text); font-family: var(--font-mono); font-size: 1.15rem; font-weight: 600; }

  .landing-footer { border-top: 1px solid var(--border); padding: 26px 0 60px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font-size: .84rem; color: var(--text-faint); }
  .landing-footer a { color: var(--text-muted); text-decoration: none; margin-right: 18px; }
  .landing-footer a:hover { color: var(--accent-strong); }

  /* ---------- landing: section scaffolding shared by everything below ---------- */
  .hero-badge { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px;
    background: var(--accent-soft); border: 1px solid rgba(124,108,246,.3); color: var(--accent-strong);
    font-size: .78rem; font-weight: 600; margin-bottom: 16px; }
  /* --good instead of --accent: this badge asserts a trust/safety claim (data
     isolation), not a value prop -- reuses the same green already used for
     "safe/positive" elsewhere (.badge-good, .mini-kpi .v.good), not a new color. */
  .hero-badge.badge-trust { background: var(--good-soft); border-color: rgba(62,207,142,.3); color: var(--good); margin-bottom: 0; }
  .trust-line { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
    text-align: center; margin: -12px 0 60px; }
  .trust-line p { margin: 0; color: var(--text-muted); font-size: .88rem; }
  @media (max-width: 600px) { .trust-line { flex-direction: column; gap: 8px; } }
  .section { padding: 10px 0 64px; }
  .section-head { max-width: 640px; margin: 0 0 30px; }
  .eyebrow { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent-strong); margin: 0 0 10px; }
  .section-head h2 { font-size: 1.65rem; font-weight: 700; letter-spacing: -.015em; margin: 0 0 10px; text-wrap: balance; }
  .section-head p { color: var(--text-muted); font-size: .95rem; line-height: 1.6; margin: 0; }

  /* ---------- landing: audience split ---------- */
  .audience-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 64px; }
  .audience-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 26px 28px; }
  .audience-card.highlight { border-color: rgba(124,108,246,.4); background: linear-gradient(180deg, var(--surface-2), var(--surface)); }
  .audience-card .tag { display: inline-block; font-family: var(--font-mono); font-size: .72rem; color: var(--text-faint);
    border: 1px solid var(--border-strong); border-radius: 7px; padding: 3px 9px; margin-bottom: 14px; }
  .audience-card.highlight .tag { color: var(--accent-strong); border-color: rgba(124,108,246,.35); }
  .audience-card h3 { font-size: 1.12rem; margin: 0 0 8px; font-weight: 700; }
  .audience-card > p { color: var(--text-muted); font-size: .89rem; line-height: 1.55; margin: 0 0 16px; }
  .audience-card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .audience-card li { font-size: .87rem; color: var(--text); padding-left: 22px; position: relative; line-height: 1.5; }
  .audience-card li::before { content: "✓"; position: absolute; left: 0; color: var(--text-faint); font-weight: 700; }
  .audience-card.highlight li::before { color: var(--good); }

  /* ---------- landing: illustrative product panels ---------- */
  .product-shots { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 64px; }
  .shot-card { border: 1px solid var(--border-strong); border-radius: 14px; background: var(--surface-2);
    padding: 18px; box-shadow: 0 18px 46px rgba(0,0,0,.35); }
  .shot-card .mini-dash-head { margin-bottom: 12px; }
  .shot-rows { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .shot-row { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--surface); padding: 10px 12px; font-size: .82rem; }
  .shot-row .name { color: var(--text); }
  .shot-row .meta { color: var(--text-faint); font-family: var(--font-mono); font-size: .74rem; }
  .badge { font-family: var(--font-mono); font-size: .7rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .badge-good { color: var(--good); background: var(--good-soft); }
  .badge-warn { color: var(--warn); background: var(--warn-soft); }
  .badge-critical { color: var(--critical); background: var(--critical-soft); }
  .shot-caption { font-size: .78rem; color: var(--text-faint); margin: 12px 2px 0; }
  .shot-card-real { padding: 10px; overflow: hidden; }
  .shot-card-real img { display: block; width: 100%; height: auto; border-radius: 8px; cursor: zoom-in; }
  .shot-card-real .shot-caption { padding: 0 4px; }

  /* ---------- landing: live demo tenant embed ---------- */
  /* Ambient accent glow layered under the usual elevation shadow -- borrowed
     from a dark fintech dashboard style reference (Fey) where the hero
     product-preview card floats with a soft colored halo instead of a plain
     drop shadow, to make the live demo read as a premium centerpiece. */
  .device-frame { border: 1px solid var(--border-strong); border-radius: 18px; background: var(--surface-2);
    box-shadow: 0 24px 64px rgba(0,0,0,.35), 0 0 90px rgba(124,108,246,.22); overflow: hidden; margin-bottom: 20px; }
  .device-frame-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    background: var(--surface); border-bottom: 1px solid var(--border); }
  .device-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
  .device-url { margin-left: 6px; font-size: .78rem; color: var(--text-faint); font-family: var(--font-mono); }
  .device-live { margin-left: auto; font-size: .74rem; color: var(--good); display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); }
  .device-live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }
  .device-frame iframe { width: 100%; height: 720px; border: 0; display: block; background: var(--bg); }
  .device-note { font-size: .78rem; color: var(--text-faint); margin: 0 2px; }
  @media (max-width: 720px) { .device-frame iframe { height: 520px; } }

  /* ---------- lightbox for real product screenshots ---------- */
  .lightbox { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 40px; background: rgba(5,6,10,.88); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 24px 60px rgba(0,0,0,.5); cursor: default; }
  .lightbox-close { position: absolute; top: 20px; right: 24px; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
    font-size: 1.1rem; cursor: pointer; }
  .lightbox-close:hover { background: var(--surface-2); border-color: var(--accent); }

  /* ---------- landing: comparison table ---------- */
  .compare-wrap { position: relative; border: 1px solid var(--border); border-radius: 16px; background: var(--surface);
    margin-bottom: 18px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .compare-table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: .87rem; }
  @media (max-width: 620px) {
    /* Hints that the table scrolls horizontally instead of the MARKETSHELPER
       column just silently vanishing off the right edge (the previous bug). */
    .compare-wrap::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0;
      width: 28px; pointer-events: none; border-radius: 0 16px 16px 0;
      background: linear-gradient(90deg, transparent, var(--surface-2)); }
  }
  .compare-table th, .compare-table td { padding: 13px 16px; text-align: center; border-bottom: 1px solid var(--border); }
  .compare-table td:first-child, .compare-table th:first-child { text-align: left; color: var(--text-muted); }
  .compare-table tr:last-child td { border-bottom: none; }
  .compare-table thead th { color: var(--text-faint); font-weight: 600; font-size: .76rem; text-transform: uppercase;
    letter-spacing: .03em; background: var(--surface-2); }
  .compare-table thead th.ms-col { color: var(--accent-strong); }
  .compare-table td.ms-col { background: var(--accent-soft); font-weight: 600; }
  .compare-price-row td { font-weight: 600; border-top: 2px solid var(--border-strong); }
  .compare-price-row td.ms-col { color: var(--good); }
  .compare-table .yes { color: var(--good); font-weight: 700; }
  .compare-table .maybe { color: var(--warn); }
  .compare-table .no { color: var(--text-faint); }
  .compare-note { font-size: .8rem; color: var(--text-faint); margin: 0 0 64px; line-height: 1.6; }

  /* ---------- landing: founder note ---------- */
  .founder-note { margin: 0 0 64px; padding: 28px 32px; background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--accent); border-radius: 14px; }
  .founder-note-tag { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent-strong); margin: 0 0 10px; }
  .founder-note-text { font-size: .96rem; line-height: 1.65; color: var(--text); margin: 0 0 12px; max-width: 74ch; }
  .founder-note-author { font-size: .84rem; color: var(--text-faint); font-weight: 600; }

  /* ---------- landing: quote ---------- */
  .quote-block { margin: 0 0 64px; padding: 40px 44px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; }
  .quote-mark { font-family: Georgia, "Times New Roman", serif; font-size: 3rem; line-height: 1; color: var(--accent);
    opacity: .55; margin: 0 0 2px; }
  .quote-text { font-size: 1.26rem; line-height: 1.55; color: var(--text); margin: 0 0 26px; font-weight: 500;
    max-width: 720px; }
  .quote-author { display: flex; align-items: center; gap: 14px; }
  .quote-photo { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    border: 1px solid var(--border); }
  .quote-author-name { font-weight: 600; font-size: .92rem; color: var(--text); }
  .quote-author-role { font-size: .8rem; color: var(--text-faint); }

  /* ---------- landing: FAQ ---------- */
  .faq { display: flex; flex-direction: column; gap: 1px; background: var(--border); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; margin-bottom: 60px; }
  .faq-item { background: var(--surface); }
  .faq-item summary { cursor: pointer; list-style: none; padding: 18px 22px; font-weight: 600; font-size: .93rem;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::after { content: "+"; color: var(--text-faint); font-size: 1.1rem; font-weight: 400; flex-shrink: 0;
    display: inline-block; transition: transform .2s ease, color .2s ease; }
  .faq-item[open] summary::after { color: var(--accent-strong); transform: rotate(45deg); }
  .faq-item p { margin: 0; padding: 0 22px 20px; color: var(--text-muted); font-size: .88rem; line-height: 1.6; max-width: 70ch; }

  /* ---------- landing: in-page nav anchors ---------- */
  .nav-bar .links a.section-link { display: none; }
  @media (min-width: 900px) { .nav-bar .links a.section-link { display: inline; } }
  #features, #calculator, #compare, #faq { scroll-margin-top: 20px; }

  /* ---------- landing: audience toggle (interactive) ---------- */
  .audience-toggle { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 20px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .at-btn { padding: 8px 16px; border: none; border-radius: 9px; background: transparent; color: var(--text-muted);
    font-family: var(--font-display); font-size: .84rem; font-weight: 600; cursor: pointer; transition: background .15s ease, color .15s ease; }
  .at-btn:hover { color: var(--text); }
  .at-btn.active { background: var(--accent); color: #0a0b12; }
  .audience-card { transition: opacity .2s ease, border-color .2s ease; }
  .audience-card.muted { opacity: .55; }

  /* ---------- landing: margin calculator (interactive, no server round-trip) ---------- */
  .calc-wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 0; border: 1px solid var(--border-strong);
    border-radius: 16px; background: var(--surface); overflow: hidden; margin-bottom: 18px; box-shadow: 0 18px 46px rgba(0,0,0,.3); }
  .calc-form { padding: 26px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; align-content: start; }
  .calc-field { display: flex; flex-direction: column; gap: 6px; }
  .calc-field.wide { grid-column: 1 / -1; }
  .calc-field label { font-size: .8rem; color: var(--text-muted); }
  .calc-field .hint { font-size: .72rem; color: var(--text-faint); }
  .calc-field input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--bg); color: var(--text); font-size: .95rem; font-family: var(--font-mono); }
  .calc-field input:focus { outline: none; border-color: var(--accent); }
  .calc-result { background: var(--surface-2); padding: 26px 28px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .calc-big { font-family: var(--font-mono); font-weight: 700; font-size: 2.1rem; line-height: 1; }
  .calc-big.good { color: var(--good); }
  .calc-big.warn { color: var(--warn); }
  .calc-big.critical { color: var(--critical); }
  .calc-result .label { font-size: .78rem; color: var(--text-faint); margin-bottom: 4px; }
  .calc-sub { font-size: .88rem; color: var(--text-muted); font-family: var(--font-mono); }
  .calc-note { font-size: .74rem; color: var(--text-faint); margin: 0; }

  /* ---------- landing: scroll-reveal ---------- */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .5s ease, transform .5s ease; }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

  /* ---------- landing: floating CTA for a long page ---------- */
  .floating-cta { position: fixed; bottom: 22px; right: 22px; z-index: 40;
    padding: 13px 22px; border-radius: 12px; background: var(--accent); color: #0a0b12;
    font-weight: 700; font-size: .89rem; text-decoration: none; box-shadow: 0 14px 34px rgba(0,0,0,.45);
    opacity: 0; transform: translateY(14px); pointer-events: none; transition: opacity .25s ease, transform .25s ease, background .15s ease; }
  .floating-cta.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .floating-cta:hover { background: var(--accent-strong); }

  .floating-tg { position: fixed; bottom: 22px; left: 22px; z-index: 40;
    width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--accent-strong);
    font-size: 1.4rem; text-decoration: none; box-shadow: 0 14px 34px rgba(0,0,0,.4);
    transition: transform .15s ease, border-color .15s ease; }
  .floating-tg:hover { transform: scale(1.06); border-color: var(--accent); }
  @media (max-width: 480px) { .floating-tg { left: 14px; bottom: 14px; width: 46px; height: 46px; font-size: 1.2rem; } }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; padding-top: 10px; }
    .feature-row { grid-template-columns: 1fr; }
    .nav-bar .links { gap: 10px 14px; }
    .nav-bar .links a.cta { padding: 7px 13px; }
    .audience-row { grid-template-columns: 1fr; }
    .product-shots { grid-template-columns: 1fr; }
    .compare-table { font-size: .78rem; }
    .compare-table th, .compare-table td { padding: 10px 8px; }
    .calc-wrap { grid-template-columns: 1fr; }
    .calc-form { grid-template-columns: 1fr; padding: 22px 20px; }
    .calc-result { padding: 22px 20px; }
    .quote-block { padding: 26px 22px; }
    .quote-text { font-size: 1.08rem; }
  }
  @media (max-width: 480px) {
    .floating-cta { left: 14px; right: 14px; bottom: 14px; text-align: center; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body class="{% block body_class %}card-layout{% endblock %}">
{% block layout %}
<div class="card{% block card_extra_class %}{% endblock %}">
{% block content %}{% endblock %}
</div>
{% endblock %}
</body>
</html>
