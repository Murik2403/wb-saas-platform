{% extends "base.html" %}
{% block title %}Новый пароль — MARKETSHELPER{% endblock %}
{% block content %}
<h1>Новый пароль</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<p class="subtitle">Придумайте новый пароль для входа.</p>
<form method="post" action="/reset-password">
  <input type="hidden" name="token" value="{{ token }}">
  <label for="password">Новый пароль</label>
  <input type="password" id="password" name="password" required autofocus>
  <label for="password_confirm">Повторите пароль</label>
  <input type="password" id="password_confirm" name="password_confirm" required>
  <button type="submit">Сохранить и войти</button>
</form>
<div class="footer-link"><a href="/login">Вернуться ко входу</a></div>
{% endblock %}
