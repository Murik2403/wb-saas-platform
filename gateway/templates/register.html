{% extends "base.html" %}
{% block title %}Регистрация — Marketshelper{% endblock %}
{% block content %}
<h1>Создать аккаунт</h1>
<p class="subtitle">Через минуту мы развернём для вас отдельный личный кабинет.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/register">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
  <label for="password">Пароль</label>
  <input type="password" id="password" name="password" required minlength="8">
  <button type="submit">Зарегистрироваться</button>
</form>
<div class="footer-link">Уже есть аккаунт? <a href="/login">Войти</a></div>
{% endblock %}
