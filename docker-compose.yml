networks:
  wbsaas_net:
    name: ${WB_SAAS_DOCKER_NETWORK:-wbsaas_net}
    # IPv6 alongside the default IPv4 config (not instead of it) -- added so
    # containers have a working route to services blocked/degraded over
    # IPv4 for this host's network (confirmed live: api.telegram.org, see
    # gateway/telegram_bot.py). ULA range, NAT66'd out through the host's
    # own IPv6 the same way container IPv4 is already NAT'd -- requires
    # "ip6tables": true in the Docker daemon's /etc/docker/daemon.json
    # (a daemon restart, not just `docker compose up`, is what actually
    # enables that; this block alone only takes effect on containers,
    # existing ones must be recreated since a live network's IPAM can't be
    # changed in place).
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:dead:beef::/64
  control_api_net:
    name: ${WB_SAAS_CONTROL_API_NETWORK:-wbsaas_control_api}
    internal: true
  docker_control_net:
    name: ${WB_SAAS_DOCKER_CONTROL_NETWORK:-wbsaas_docker_control}
    internal: true
  docker_discovery_net:
    name: ${WB_SAAS_DOCKER_DISCOVERY_NETWORK:-wbsaas_docker_discovery}
    internal: true

volumes:
  traefik_letsencrypt:
  gateway_data:
  postgres_data:

services:
  docker-socket-proxy:
    # Narrowed Docker API surface for the provisioner: only the operations
    # needed for tenant lifecycle and backups are exposed.
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    networks:
      - docker_control_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Required so provisioning can create networks/containers via the proxy.
      # The image's rule engine is resource-based; method-based vars are not
      # accepted in this tag, so POST must be enabled for the allow-listed
      # paths above.
      - POST=1
      - INFO=1
      - CONTAINERS=1
      - CONTAINERS_CREATE=1
      - CONTAINERS_START=1
      - CONTAINERS_STOP=1
      - CONTAINERS_REMOVE=1
      - CONTAINERS_LIST=1
      - IMAGES=1
      - IMAGES_CREATE=1
      - NETWORKS=1
      - NETWORKS_CREATE=1
      - NETWORKS_CONNECT=1
      - NETWORKS_DISCONNECT=1
      - VOLUMES=1
      - VOLUMES_CREATE=1

  docker-discovery-proxy:
    # Only Traefik discovery reaches this read-only Docker API endpoint.
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    networks:
      - docker_discovery_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - POST=0
      - CONTAINERS=1
      - NETWORKS=1
      - EVENTS=1
      - PING=1
      - VERSION=1

  provisioner:
    build: ./provisioner
    mem_limit: ${WB_SAAS_PROVISIONER_MEM_LIMIT:-256m}
    memswap_limit: ${WB_SAAS_PROVISIONER_MEM_LIMIT:-256m}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    depends_on:
      - docker-socket-proxy
    networks:
      control_api_net:
        aliases:
          - provisioner
      docker_control_net: {}
    volumes:
      # The daemon sees the host path from WB_SAAS_BACKUP_DIR while this
      # container sees the same fixed location at /backups for retention.
      - ${WB_SAAS_BACKUP_DIR:-/opt/wb-saas/backups}:/backups
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - WB_SAAS_PROVISIONER_BEARER_KEY=${WB_SAAS_PROVISIONER_BEARER_KEY:?Provisioner purpose key is required}
      - WB_SAAS_PARENT_DOMAIN=${WB_SAAS_PARENT_DOMAIN}
      - WB_SAAS_TENANT_SUBDOMAIN_PREFIX=${WB_SAAS_TENANT_SUBDOMAIN_PREFIX:-app}
      - WB_SAAS_TENANT_IMAGE=${WB_SAAS_TENANT_IMAGE:-wb-dashboard-tenant:redesign}
      - WB_SAAS_TENANT_INTERNAL_PORT=${WB_SAAS_TENANT_INTERNAL_PORT:-8501}
      - WB_SAAS_TENANT_MEM_LIMIT=${WB_SAAS_TENANT_MEM_LIMIT:-768m}
      - WB_SAAS_TENANT_CPU_QUOTA=${WB_SAAS_TENANT_CPU_QUOTA:-1.0}
      - WB_SAAS_TENANT_MEM_RESERVATION=${WB_SAAS_TENANT_MEM_RESERVATION:-384m}
      - WB_SAAS_TENANT_MEMORY_BUDGET=${WB_SAAS_TENANT_MEMORY_BUDGET:-}
      - WB_SAAS_TENANT_MEMORY_FRACTION=${WB_SAAS_TENANT_MEMORY_FRACTION:-0.7}
      - WB_SAAS_TENANT_MIN_AVAILABLE=${WB_SAAS_TENANT_MIN_AVAILABLE:-1g}
      - WB_SAAS_TENANT_ADMISSION_WAIT=${WB_SAAS_TENANT_ADMISSION_WAIT:-0}
      - WB_SAAS_FORWARD_AUTH_MIDDLEWARE=wb-saas-auth@file
      - WB_SAAS_TLS_CERT_RESOLVER=http-resolver
      - WB_SAAS_BACKUP_DIR=${WB_SAAS_BACKUP_DIR:-/opt/wb-saas/backups}
      - WB_SAAS_BACKUP_ENCRYPTION_KEY=${WB_SAAS_BACKUP_ENCRYPTION_KEY:-}
      - WB_SAAS_DEMO_DAILY_REFRESH=${WB_SAAS_DEMO_DAILY_REFRESH:-0}
      - WB_SAAS_DEMO_REFRESH_HOUR_MOSCOW=${WB_SAAS_DEMO_REFRESH_HOUR_MOSCOW:-3}
      - WB_SAAS_TRAEFIK_CONTAINER_NAME=${WB_SAAS_TRAEFIK_CONTAINER_NAME:-wb-saas-traefik-1}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Opt-in (profiles: [postgres]) -- a bare `docker compose up -d` never
  # starts this. Only relevant once WB_SAAS_DB_BACKEND=postgres is actually
  # set (see DEPLOY.md's "Switching the control-plane db to Postgres");
  # until then the gateway runs on SQLite and this service would just sit
  # there unused. No published port -- reached only from other containers
  # over wbsaas_net, never from the host's public IP.
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    mem_limit: ${WB_SAAS_POSTGRES_MEM_LIMIT:-512m}
    memswap_limit: ${WB_SAAS_POSTGRES_MEM_LIMIT:-512m}
    restart: unless-stopped
    networks:
      - wbsaas_net
    environment:
      - POSTGRES_USER=${WB_SAAS_POSTGRES_USER:-wbsaas}
      - POSTGRES_PASSWORD=${WB_SAAS_POSTGRES_PASSWORD}
      - POSTGRES_DB=${WB_SAAS_POSTGRES_DB:-wbsaas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WB_SAAS_POSTGRES_USER:-wbsaas} -d ${WB_SAAS_POSTGRES_DB:-wbsaas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    # v3.0 has a known Docker-provider bug against modern Docker Engine
    # (>=29): it hardcodes API version 1.24, which newer daemons refuse
    # ("client version 1.24 is too old"), so it can NEVER discover any
    # container and every request gets Traefik's own 404 fallback -- not a
    # DNS/TLS problem, routing itself is dead. Fixed in v3.6.1+; see
    # https://github.com/traefik/traefik/issues/12253
    image: traefik:v3.6.13
    mem_limit: ${WB_SAAS_TRAEFIK_MEM_LIMIT:-256m}
    memswap_limit: ${WB_SAAS_TRAEFIK_MEM_LIMIT:-256m}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    networks:
      - wbsaas_net
      - docker_discovery_net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt
    depends_on:
      - docker-discovery-proxy
    environment:
      # Traefik reads TRAEFIK_* env vars as static config directly (unlike
      # ${VAR} placeholders inside traefik.yml, which it does NOT expand).
      # HTTP-01 resolver for apex domain (marketshelper.ru)
      - TRAEFIK_CERTIFICATESRESOLVERS_HTTP_RESOLVER_ACME_EMAIL=${WB_SAAS_ACME_EMAIL}
      # DNS-01 resolver for wildcard tenant domain (*.app.marketshelper.ru)
      - TRAEFIK_CERTIFICATESRESOLVERS_DNS_RESOLVER_ACME_EMAIL=${WB_SAAS_ACME_EMAIL}
      # DNS-01 credential for the timewebcloud provider (lego's environment var name).
      # Kept in .env on the server, never committed.
      - TIMEWEBCLOUD_AUTH_TOKEN=${TIMEWEBCLOUD_AUTH_TOKEN}

  gateway:
    build: ./gateway
    mem_limit: ${WB_SAAS_GATEWAY_MEM_LIMIT:-1024m}
    memswap_limit: ${WB_SAAS_GATEWAY_MEM_LIMIT:-1024m}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    networks:
      wbsaas_net:
        aliases:
          - gateway
      control_api_net:
        aliases:
          - gateway
    volumes:
      - gateway_data:/app/data
      # Independent of control-plane snapshots; initialize explicitly before startup.
      - ${WB_SAAS_ERASURE_LEDGER_DIR:-/opt/wb-saas/erasure-ledger}:/app/erasure-ledger
      # scripts/run_billing_cycle.py and scripts/backup_tenant_volumes.py both
      # read the real accounts DB (logic/db.py), which only exists inside
      # this container's /app/data (the gateway_data volume above) -- running
      # them from the host instead would silently open an empty DB file from
      # the git checkout and look like it "worked" while doing nothing.
      # Mounted read-only; PYTHONPATH=/app is required on the exec (the
      # scripts' own sys.path insert assumes a sibling gateway/ dir that
      # doesn't exist in this flat image layout) -- see DEPLOY.md.
      - ./scripts:/app/scripts:ro
    environment:
      - WB_SAAS_PARENT_DOMAIN=${WB_SAAS_PARENT_DOMAIN}
      - WB_SAAS_ERASURE_LEDGER_PATH=/app/erasure-ledger/erasures.sqlite3
      - WB_SAAS_ERASURE_LEDGER_REQUIRED=1
      - WB_SAAS_TENANT_SUBDOMAIN_PREFIX=${WB_SAAS_TENANT_SUBDOMAIN_PREFIX:-app}
      - WB_SAAS_TENANT_IMAGE=${WB_SAAS_TENANT_IMAGE:-wb-dashboard-tenant:redesign}
      - WB_SAAS_DOCKER_NETWORK=${WB_SAAS_DOCKER_NETWORK:-wbsaas_net}
      - WB_SAAS_TENANT_INTERNAL_PORT=${WB_SAAS_TENANT_INTERNAL_PORT:-8501}
      - WB_SAAS_TENANT_MEM_LIMIT=${WB_SAAS_TENANT_MEM_LIMIT:-768m}
      - WB_SAAS_TENANT_CPU_QUOTA=${WB_SAAS_TENANT_CPU_QUOTA:-1.0}
      - WB_SAAS_PROVISION_TIMEOUT=${WB_SAAS_PROVISION_TIMEOUT:-180}
      - WB_SAAS_PROVISION_CAPACITY_WAIT=${WB_SAAS_PROVISION_CAPACITY_WAIT:-900}
      - WB_SAAS_PROVISION_CAPACITY_RETRY=${WB_SAAS_PROVISION_CAPACITY_RETRY:-20}
      - WB_SAAS_PROVISIONER_URL=http://provisioner:8001
      - WB_SAAS_PROVISIONER_BEARER_KEY=${WB_SAAS_PROVISIONER_BEARER_KEY:?Provisioner purpose key is required}
      - WB_SAAS_TENANT_ENCRYPTION_MASTER_KEY=${WB_SAAS_TENANT_ENCRYPTION_MASTER_KEY:-}
      - WB_SAAS_TENANT_ENCRYPTION_KEY_ID=${WB_SAAS_TENANT_ENCRYPTION_KEY_ID:-current}
      - WB_SAAS_TENANT_ENCRYPTION_KEYRING=${WB_SAAS_TENANT_ENCRYPTION_KEYRING:-}
      - WB_SAAS_COOKIE_SECURE=${WB_SAAS_COOKIE_SECURE:-1}
      # Optional public analytics and verification: .env alone does not
      # inject values into a service with an explicit environment list.
      - WB_SAAS_GROWTH_COOKIE_SECRET=${WB_SAAS_GROWTH_COOKIE_SECRET:-}
      - WB_SAAS_YANDEX_METRIKA_ID=${WB_SAAS_YANDEX_METRIKA_ID:-}
      - WB_SAAS_YANDEX_VERIFICATION=${WB_SAAS_YANDEX_VERIFICATION:-}
      - WB_SAAS_GOOGLE_VERIFICATION=${WB_SAAS_GOOGLE_VERIFICATION:-}
      # Public app association identifiers; keep empty until real signing data exists.
      - WB_SAAS_ANDROID_PACKAGE=${WB_SAAS_ANDROID_PACKAGE:-}
      - WB_SAAS_ANDROID_SHA256=${WB_SAAS_ANDROID_SHA256:-}
      - WB_SAAS_IOS_APP_ID=${WB_SAAS_IOS_APP_ID:-}
      - WB_SAAS_FORWARD_AUTH_MIDDLEWARE=wb-saas-auth@file
      - WB_SAAS_TLS_CERT_RESOLVER=letsencrypt
      # Billing (logic/billing.py, yookassa_client.py) -- previously missing
      # here entirely, so .env values for these never reached the container
      # and the app silently ran on its built-in defaults instead.
      - WB_SAAS_TRIAL_DAYS=${WB_SAAS_TRIAL_DAYS:-14}
      - WB_SAAS_BILLING_PERIOD_DAYS=${WB_SAAS_BILLING_PERIOD_DAYS:-30}
      - WB_SAAS_SUBSCRIPTION_PRICE_RUB=${WB_SAAS_SUBSCRIPTION_PRICE_RUB:-2990}
      - WB_SAAS_GRACE_PERIOD_DAYS=${WB_SAAS_GRACE_PERIOD_DAYS:-5}
      - WB_SAAS_YOOKASSA_SHOP_ID=${WB_SAAS_YOOKASSA_SHOP_ID:-}
      - WB_SAAS_YOOKASSA_SECRET_KEY=${WB_SAAS_YOOKASSA_SECRET_KEY:-}
      - WB_SAAS_YOOKASSA_WEBHOOK_CIDRS=${WB_SAAS_YOOKASSA_WEBHOOK_CIDRS:-}
      # Password reset (logic/password_reset.py, mailer.py) -- same issue.
      - WB_SAAS_PASSWORD_RESET_TTL_MINUTES=${WB_SAAS_PASSWORD_RESET_TTL_MINUTES:-60}
      - WB_SAAS_HIBP_TIMEOUT_SECONDS=${WB_SAAS_HIBP_TIMEOUT_SECONDS:-3}
      - WB_SAAS_SMTP_HOST=${WB_SAAS_SMTP_HOST:-}
      - WB_SAAS_SMTP_PORT=${WB_SAAS_SMTP_PORT:-587}
      - WB_SAAS_SMTP_USER=${WB_SAAS_SMTP_USER:-}
      - WB_SAAS_SMTP_PASSWORD=${WB_SAAS_SMTP_PASSWORD:-}
      - WB_SAAS_SMTP_USE_STARTTLS=${WB_SAAS_SMTP_USE_STARTTLS:-1}
      # Mirrors config.py's own Python-side fallback ("no-reply@" + domain) --
      # if this were a bare empty-string default instead, an unset .env value
      # would arrive in the container as an explicit empty string, which
      # os.environ.get() treats as "set" and returns as-is, silently
      # overriding that smarter default with a blank From address.
      - WB_SAAS_SMTP_FROM_EMAIL=${WB_SAAS_SMTP_FROM_EMAIL:-no-reply@${WB_SAAS_PARENT_DOMAIN}}
      # Telegram support relay (telegram_bot.py) -- see docker-entrypoint.sh.
      # Empty token disables the relay; gateway starts and runs normally
      # either way.
      - WB_SAAS_TELEGRAM_BOT_TOKEN=${WB_SAAS_TELEGRAM_BOT_TOKEN:-}
      - WB_SAAS_TELEGRAM_BOT_USERNAME=${WB_SAAS_TELEGRAM_BOT_USERNAME:-}
      - WB_SAAS_TELEGRAM_OWNER_CHAT_ID=${WB_SAAS_TELEGRAM_OWNER_CHAT_ID:-}
      # Admin panel (/admin) -- comma-separated allowlist, empty disables it
      # entirely even for a logged-in account. See config.py's ADMIN_EMAILS.
      - WB_SAAS_ADMIN_EMAILS=${WB_SAAS_ADMIN_EMAILS:-}
      # Internal API (internal_routes.py) -- shared secret tenant containers
      # present when calling back to the gateway (e.g. to email a scheduled
      # report). Empty disables the feature entirely rather than accepting
      # an empty string as a valid secret -- see config.py's INTERNAL_API_SECRET.
      - WB_SAAS_INTERNAL_API_SECRET=${WB_SAAS_INTERNAL_API_SECRET:-}
      - WB_SAAS_MAX_REPORT_UPLOAD_BYTES=${WB_SAAS_MAX_REPORT_UPLOAD_BYTES:-20971520}
      - WB_SAAS_SENTRY_DSN=${WB_SAAS_SENTRY_DSN:-}
      - WB_SAAS_SENTRY_TENANT_DSN=${WB_SAAS_SENTRY_TENANT_DSN:-}
      - WB_SAAS_SENTRY_ENVIRONMENT=${WB_SAAS_SENTRY_ENVIRONMENT:-production}
    depends_on:
      provisioner:
        condition: service_healthy
    healthcheck:
      # Health endpoint consumed by container orchestrations and uptime checks.
      # Using plain TCP to localhost avoids routing noise through Traefik.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    labels:
      - traefik.enable=true
      - traefik.http.routers.gateway.rule=Host(`${WB_SAAS_PARENT_DOMAIN}`)
      - traefik.http.routers.gateway.entrypoints=websecure
      - traefik.http.routers.gateway.tls.certresolver=http-resolver
      - traefik.http.services.gateway.loadbalancer.server.port=8000
      # wb-saas-auth (referenced by every tenant container's own labels, see
      # gateway/provisioning.py container_labels()) is defined in
      # traefik/dynamic.yml, NOT here -- a middleware tied to this
      # container's labels used to disappear from Traefik's config for a
      # few seconds on every gateway redeploy, breaking every tenant
      # request in that window. See dynamic.yml for the full story.
