# Static Traefik configuration. Dynamic routing (which host goes to which
# container) comes entirely from Docker labels -- the gateway's own labels
# (docker-compose.yml) and each tenant container's labels
# (gateway/provisioning.py's container_labels()) -- not from files here.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false   # only containers with traefik.enable=true are routed --
                              # otherwise every container on the shared network (including
                              # ones with no business being public) would get exposed.
    network: wbsaas_net
  # Holds the wb-saas-auth ForwardAuth middleware -- kept out of the Docker
  # provider deliberately so it isn't tied to the gateway container's
  # lifecycle. See dynamic.yml for why.
  file:
    filename: /etc/traefik/dynamic.yml

# While first testing DNS/TLS on a new domain, uncomment caServer below to
# use Let's Encrypt's staging environment (untrusted certs, but no rate
# limit risk) -- remove it again before going live for real trusted certs.
#
# NOTE: the ACME "email" field is intentionally NOT set here. Traefik does
# NOT expand ${VAR} placeholders inside this static config file (that's a
# docker-compose-only feature) -- a literal "${WB_SAAS_ACME_EMAIL}" string
# would be sent to Let's Encrypt as the contact email and rejected. Instead
# it's set via the TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL
# environment variable on the traefik service in docker-compose.yml, which
# Traefik reads natively and merges with this file.
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json
      # DNS-01 challenge via Timeweb Cloud (the domain's DNS host). Switched
      # from httpChallenge so we can obtain a single WILDCARD certificate for
      # *.app.marketshelper.ru -- Let's Encrypt only issues wildcards over
      # DNS-01, never HTTP-01. One wildcard cert covers every tenant subdomain
      # instantly, so a freshly-provisioned tenant is served a trusted cert
      # from its very first request (previously each subdomain triggered its
      # own on-demand HTTP-01 issuance, and during that ~10-30s window Traefik
      # served its self-signed default -> the browser's "Подключение не
      # защищено" warning). Also removes the per-subdomain Let's Encrypt
      # rate-limit exposure entirely. The TIMEWEBCLOUD_AUTH_TOKEN env var is
      # passed to the traefik service in docker-compose.yml.
      dnsChallenge:
        provider: timewebcloud
        # Public resolvers used to check the _acme-challenge TXT record has
        # propagated before telling Let's Encrypt to validate.
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
      # caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"

api:
  dashboard: false   # flip on + protect with auth if you want the Traefik UI; off by default

log:
  level: INFO
