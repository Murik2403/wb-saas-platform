# Static Traefik configuration. Dynamic routing (which host goes to which
# container) comes entirely from Docker labels -- the gateway's own labels
# (docker-compose.yml) and each tenant container's labels
# (gateway/provisioning.py's container_labels()) -- not from files here.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false   # only containers with traefik.enable=true are routed --
                              # otherwise every container on the shared network (including
                              # ones with no business being public) would get exposed.
    network: wbsaas_net
  # Holds the wb-saas-auth ForwardAuth middleware -- kept out of the Docker
  # provider deliberately so it isn't tied to the gateway container's
  # lifecycle. See dynamic.yml for why.
  file:
    filename: /etc/traefik/dynamic.yml

# While first testing DNS/TLS on a new domain, uncomment caServer below to
# use Let's Encrypt's staging environment (untrusted certs, but no rate
# limit risk) -- remove it again before going live for real trusted certs.
#
# NOTE: the ACME "email" field is intentionally NOT set here. Traefik does
# NOT expand ${VAR} placeholders inside this static config file (that's a
# docker-compose-only feature) -- a literal "${WB_SAAS_ACME_EMAIL}" string
# would be sent to Let's Encrypt as the contact email and rejected. Instead
# it's set via the TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL
# environment variable on the traefik service in docker-compose.yml, which
# Traefik reads natively and merges with this file.
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json
      # DNS-01 wildcard (*.app.<domain>) -- eliminates the brief self-signed
      # window a brand-new tenant subdomain shows before its on-demand cert is
      # issued: one wildcard cert already covers every tenant, nothing is issued
      # per-request.
      #
      # HISTORY: an earlier DNS-01 attempt failed with "did not return the
      # expected TXT record". Root cause was NOT a provider mismatch -- the zone
      # IS in Timeweb Cloud and the timewebcloud lego provider CAN write to it.
      # The real cause: marketshelper.ru was delegated to 4 nameservers
      # (ns1/ns2.timeweb.ru + ns3/ns4.timeweb.org); the Cloud API only pushes
      # records to the .ru cluster instantly, while the .org secondaries lagged
      # up to the SOA refresh (8h). Let's Encrypt sometimes validated against a
      # stale .org server and failed. Fixed by narrowing the domain's delegation
      # to ns1/ns2.timeweb.ru only (both serve the full, current zone), so every
      # authoritative answer now comes from the Cloud-synced cluster.
      #
      # TIMEWEBCLOUD_AUTH_TOKEN is provided to the container via docker-compose
      # (lego reads that exact env var). resolvers below are used for lego's own
      # pre-flight propagation self-check.
      #
      # Rollback: replace this dnsChallenge block with `httpChallenge:
      #   entryPoint: web` (known-good per-domain HTTP-01).
      dnsChallenge:
        provider: timewebcloud
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
      # caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"

api:
  dashboard: false   # flip on + protect with auth if you want the Traefik UI; off by default

log:
  level: INFO
