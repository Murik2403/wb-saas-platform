map $http_x_forwarded_proto $tenant_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

map $http_x_mh_shop_id $selected_shop_request {
    default 0;
    "~^[1-9][0-9]{0,8}$" 1;
}

server {
    listen 8501;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The import of expenses promises 5 MiB.
    client_max_body_size 6m;

    # No CSP on purpose: the PWA relies on inline styles. An add_header inside a
    # location drops every server-level one, so locations that set their own
    # (API ones: no-store, sw.js) repeat the security headers below.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8001/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tenant_forwarded_proto;
    }

    location = /_stcore/health {
        proxy_pass http://127.0.0.1:8001/_stcore/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tenant_forwarded_proto;
    }

    # Explicit bounded history loads may take longer than Nginx's 60s default.
    # Limit the extended timeout to these authenticated user-initiated routes.
    location ~ ^/api/v1/(shop-workspaces/[0-9]+/sync|ozon-accounting/sync)$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 630s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tenant_forwarded_proto;
        proxy_set_header X-Tenant-Account $http_x_tenant_account;
        proxy_set_header X-Tenant-Role $http_x_tenant_role;
        proxy_set_header X-MH-Gateway-Auth $http_x_mh_gateway_auth;
    }

    location /api/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        error_page 418 = @selected_shop_api;
        if ($selected_shop_request) { return 418; }
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tenant_forwarded_proto;
        # Traefik's ForwardAuth injects the verified tenant identity into the
        # request. Forward it explicitly so write endpoints keep the identity
        # through the Nginx -> Uvicorn hop (especially POST activation events).
        proxy_set_header X-Tenant-Account $http_x_tenant_account;
        proxy_set_header X-Tenant-Role $http_x_tenant_role;
        proxy_set_header X-MH-Gateway-Auth $http_x_mh_gateway_auth;
    }

    # Named routing preserves method and body; primary requests retain 60s.
    # Selected-shop queue and subprocess share a 90s application deadline.
    location @selected_shop_api {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 100s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tenant_forwarded_proto;
        proxy_set_header X-Tenant-Account $http_x_tenant_account;
        proxy_set_header X-Tenant-Role $http_x_tenant_role;
        proxy_set_header X-MH-Gateway-Auth $http_x_mh_gateway_auth;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
