map $http_x_forwarded_proto $tenant_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 8501;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        proxy_pass http://127.0.0.1:8001/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tenant_forwarded_proto;
    }

    location = /_stcore/health {
        proxy_pass http://127.0.0.1:8001/_stcore/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tenant_forwarded_proto;
    }

    # Explicit bounded history loads may take longer than Nginx's 60s default.
    # Limit the extended timeout to these authenticated user-initiated routes.
    location ~ ^/api/v1/(shop-workspaces/[0-9]+/sync|ozon-accounting/sync)$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 630s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tenant_forwarded_proto;
        proxy_set_header X-Tenant-Account $http_x_tenant_account;
        proxy_set_header X-Tenant-Role $http_x_tenant_role;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $tenant_forwarded_proto;
        # Traefik's ForwardAuth injects the verified tenant identity into the
        # request. Forward it explicitly so write endpoints keep the identity
        # through the Nginx -> Uvicorn hop (especially POST activation events).
        proxy_set_header X-Tenant-Account $http_x_tenant_account;
        proxy_set_header X-Tenant-Role $http_x_tenant_role;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
