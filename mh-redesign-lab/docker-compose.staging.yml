services:
  redesign-frontend:
    build:
      context: .
      dockerfile: Dockerfile.staging
    image: wb-dashboard-redesign:staging
    restart: unless-stopped
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8501/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5
