<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <title>MARKETSHELPER — нет соединения</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #07090d; color: #f3f6fb; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; }
      main { width: min(100%, 440px); padding: 28px; border: 1px solid #2b3340; border-radius: 24px; background: #111722; box-sizing: border-box; }
      .mark { color: #8bb7ff; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 14px 0 10px; font-size: clamp(26px, 7vw, 34px); line-height: 1.08; }
      p { margin: 0; color: #acb7c8; font-size: 16px; line-height: 1.55; }
      button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 14px; background: #5d94f5; color: #06101f; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">MARKETSHELPER</div>
      <h1>Нет соединения</h1>
      <p>Проверьте интернет и повторите. Данные кабинета не сохраняются на этом экране.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
