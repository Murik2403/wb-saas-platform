name: MARKETSHELPER CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-provisioner:
    name: Provisioner Policy Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Provisioner Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r provisioner/requirements.txt pytest

      - name: Run Provisioner Policy Tests
        run: |
          cd provisioner && python -m pytest -q

  test-gateway:
    name: Gateway Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gateway Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt

      - name: Run Gateway Unit Tests
        # pytest, not `unittest discover` -- tests/test_db_backend_postgres.py
        # is a pytest-style test (needs the postgres_dsn fixture from
        # conftest.py to spin up a real, disposable Postgres via
        # testcontainers), which `unittest discover` would silently find zero
        # of. pytest also runs every existing unittest.TestCase suite here
        # natively, so one command covers both (same fix as tenant-app's CI
        # job). ubuntu-latest ships Docker preinstalled, which is what
        # testcontainers needs -- that test self-skips if it isn't reachable.
        run: |
          cd gateway && python -m pytest -q

  test-tenant-app:
    name: Tenant App Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tenant App Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tenant-app/requirements.txt

      - name: Run Tenant App Unit Tests
        # pytest, not `unittest discover` -- agents/tests/ and reports/tests/
        # are plain pytest-style test_*() functions (tmp_path fixture, bare
        # assert), which `unittest discover` silently finds zero of. pytest
        # also runs tenant-app/tests/'s unittest.TestCase suites natively, so
        # one command covers all three test directories.
        run: |
          cd tenant-app && python -m pytest -q

      - name: Run Redesign API Tests
        run: python -m pytest mh-redesign-lab/tenant-api/tests -q

  test-frontends:
    name: Build Frontends
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, mh-redesign-lab]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Check history formatting
        if: matrix.project == 'mh-redesign-lab'
        run: node scripts/test-history-format.mjs
