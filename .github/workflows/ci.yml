name: MARKETSHELPER CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-provisioner:
    name: Provisioner Policy Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Provisioner Dependencies
        run: |
          python -m pip install --require-hashes -r provisioner/requirements.lock

      - name: Run Provisioner Policy Tests
        run: |
          cd provisioner && python -m pytest -q

  test-gateway:
    name: Gateway Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gateway Dependencies
        run: |
          python -m pip install --require-hashes -r gateway/requirements.lock

      - name: Run Gateway Unit Tests
        # pytest, not `unittest discover` -- tests/test_db_backend_postgres.py
        # is a pytest-style test (needs the postgres_dsn fixture from
        # conftest.py to spin up a real, disposable Postgres via
        # testcontainers), which `unittest discover` would silently find zero
        # of. pytest also runs every existing unittest.TestCase suite here
        # natively, so one command covers both (same fix as tenant-app's CI
        # job). ubuntu-latest ships Docker preinstalled, which is what
        # testcontainers needs -- that test self-skips if it isn't reachable.
        run: |
          cd gateway && python -m pytest -q

  test-tenant-app:
    name: Tenant App Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tenant App Dependencies
        run: |
          python -m pip install --require-hashes -r tenant-app/requirements.lock

      - name: Run Tenant App Unit Tests
        # pytest, not `unittest discover` -- agents/tests/ and reports/tests/
        # are plain pytest-style test_*() functions (tmp_path fixture, bare
        # assert), which `unittest discover` silently finds zero of. pytest
        # also runs tenant-app/tests/'s unittest.TestCase suites natively, so
        # one command covers all three test directories.
        run: |
          cd tenant-app && python -m pytest -q

      - name: Run Redesign API Tests
        if: |
          hashFiles('mh-redesign-lab/tenant-api/tests/test_audit_regressions.py') != ''
        working-directory: mh-redesign-lab/tenant-api
        run: python -m pytest tests -q

  test-frontends:
    name: Frontend Tests and Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, mh-redesign-lab]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('${{ matrix.project }}/package.json') != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
        if: hashFiles('${{ matrix.project }}/package.json') != ''
      - run: npm audit --audit-level=high
        if: hashFiles('${{ matrix.project }}/package.json') != ''
      - name: Run Frontend Unit Tests
        if: matrix.project == 'mh-redesign-lab'
        run: npm test
      - run: npm run build
        if: hashFiles('${{ matrix.project }}/package.json') != ''
      - name: Check history formatting
        if: matrix.project == 'mh-redesign-lab' && hashFiles('mh-redesign-lab/scripts/test-history-format.mjs') != ''
        run: node scripts/test-history-format.mjs

  audit-python:
    name: Audit Python Dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lock:
          - gateway/requirements.lock
          - provisioner/requirements.lock
          - tenant-app/requirements.lock
    steps:
      - uses: actions/checkout@v4
      - name: Audit ${{ matrix.lock }}
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: ${{ matrix.lock }}
          no-deps: true
          require-hashes: true

  scan-images:
    name: Scan ${{ matrix.name }} Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - name: provisioner
            context: provisioner
            dockerfile: provisioner/Dockerfile
          - name: tenant-app
            context: tenant-app
            dockerfile: tenant-app/Dockerfile
          - name: tenant-staging
            context: .
            dockerfile: mh-redesign-lab/Dockerfile.tenant-staging
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        run: docker build --file ${{ matrix.dockerfile }} --build-arg REDESIGN_BUILD_ID=${{ github.sha }} --tag wbsaas/${{ matrix.name }}:${{ github.sha }} ${{ matrix.context }}
      - name: Scan high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: wbsaas/${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
