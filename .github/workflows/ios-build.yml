name: Marketshelper iOS build
on:
  workflow_dispatch:
  push:
    branches: [codex/ios-build-20261023]
    paths: ['mobile/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx cap sync ios
      - run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: marketshelper-ios
          path: mobile/dist-ios/
          if-no-files-found: error
          retention-days: 14
